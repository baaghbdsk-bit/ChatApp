name: Build ChatApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  API_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/chatapp-api
  FRONTEND_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/chatapp-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application images
        run: docker compose build

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/chatapp-api.dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE_NAME }}:latest

      - name: Build and push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
