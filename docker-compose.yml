version: '3.8'

services:
  # .NET API Service
  chatapp-api:
    build:
      context: .
      dockerfile: dockerfiles/chatapp-api.dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./backend:/backend
    networks:
      - chatapp-network

  # Angular Frontend Service
  chatapp-frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    ports:
      - "7860:80"
    depends_on:
      - chatapp-api
    networks:
      - chatapp-network

networks:
  chatapp-network:
    driver: bridge
